<main class="br waiting" aria-label="Siva and Miles animated course replay">
  <header class="br-head"><div><span class="eyebrow">FOLLOW THE FOOTSTEPS</span><h1>Siva + <em>Miles.</em></h1><p id="race-subtitle">Preparing your course replay…</p></div><span id="data-badge" class="badge">WAITING FOR DATA</span></header>
  <div id="data-notice" class="notice" role="status">Waiting for the local workout database.</div>
  <section class="course" aria-label="Animated recorded course">
    <span id="route-kind" class="route-kind">Route trace · north up</span>
      <div class="course-wrap">
        <svg id="course-svg" viewBox="0 0 920 420" role="img" aria-label="GPS route with moving runner and burro marker">
          <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c5d8cd" stroke-opacity=".05"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs>
          <rect width="920" height="420" fill="url(#grid)"/>
          <g id="map-tiles"></g>
          <g class="contours" fill="none" stroke="#8ba895" opacity=".08"><path d="M-50 220Q180 -50 450 100T1000 20M-50 250Q180 -20 450 130T1000 50M-50 280Q180 10 450 160T1000 80M-50 310Q180 40 450 190T1000 110M-50 340Q180 70 450 220T1000 140M-50 370Q180 100 450 250T1000 170M-50 400Q180 130 450 280T1000 200"/></g>
          <g transform="translate(864 46)"><path d="M0 0L-5 15H5Z" fill="#c7d7ce"/><text y="-9" text-anchor="middle" class="svg-note">N</text></g>
          <path id="route-shadow" fill="none" stroke="#a4cfc4" stroke-width="14" opacity=".05" stroke-linecap="round"/>
          <path id="route-base" fill="none" stroke="#527b77" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="route-progress-glow" fill="none" stroke="#ffc77c" stroke-width="9" opacity=".25" filter="url(#glow)"/>
          <path id="route-progress" fill="none" stroke="#ffc77c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <g id="course-markers"></g>
          <g id="runner-marker"><circle r="12" fill="#ffc77c" fill-opacity=".16"/><circle r="5" fill="#ffc77c" stroke="#f9efd8" stroke-width="2"/><g class="trot"><image href="__SPRITE_DATA__" x="-55" y="-76" width="110" height="73"/></g></g>
          <g transform="translate(28 380)"><path id="scale-line" d="M0 -4V0H100V-4" fill="none" stroke="#9cb5ac"/><text id="scale-label" y="18" class="svg-note">—</text></g>
          <text id="map-caption" x="892" y="400" text-anchor="end" class="svg-note">ROUTE TRACE</text>
          <text id="no-route" x="460" y="215" text-anchor="middle" fill="#bdcdc7" font-size="18">Waiting for GPS points</text>
        </svg>
        <div class="map-controls" aria-label="Map controls"><button id="map-out" aria-label="Zoom map out" type="button">−</button><button id="map-fit" aria-label="Fit map to route" type="button">Fit course</button><button id="map-in" aria-label="Zoom map in" type="button">+</button></div><div id="map-attribution" class="map-attribution" hidden>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a></div><div class="map-corner"><span class="live-dot"></span><span id="replay-label">REPLAY READY</span></div>
      </div>
      <div class="playback"><button id="play" class="primary" type="button" aria-label="Play race replay">▶ Play</button><button id="restart" type="button" aria-label="Restart replay">↺</button><span id="replay-clock" class="clock">00:00</span><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Replay position"/><span id="replay-end" class="clock">—</span><label class="speed-label">Speed<select id="speed" aria-label="Replay speed"><option value="1">1×</option><option value="10">10×</option><option value="30">30×</option><option value="60" selected>60×</option><option value="120">120×</option></select></label></div>
  </section>
  <footer class="br-footer"><span id="device-details">Device details pending</span><span id="quality-note">Historical replay · local SQLite</span></footer>
</main>
